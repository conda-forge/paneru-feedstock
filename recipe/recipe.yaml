context:
  version: "0.5.1"

package:
  name: paneru
  version: ${{ version }}

source:
  url: https://github.com/karinushka/paneru/archive/v${{ version }}.tar.gz
  sha256: f72b51ae41d80dd06b06da8474bce44b338c97c11518b5714156ad93abeab5ed

build:
  number: 0
  skip:
    - win
    - linux
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      - cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --path . --locked --no-track

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - paneru --version
      - paneru --help
  - package_contents:
      strict: true
      bin:
        - paneru

about:
  homepage: https://github.com/karinushka/paneru
  summary: "A sliding, tiling window manager for MacOS."
  description: |
    Paneru is a MacOS window manager that arranges windows on an infinite strip, extending to the right. A core principle is that opening a new window will never cause existing windows to resize, maintaining your layout stability.
  license: MIT
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml
  repository: https://github.com/karinushka/paneru

extra:
  recipe-maintainers:
    - XhstormR
